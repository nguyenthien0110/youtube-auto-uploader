name: Auto Upload Drive Videos to YouTube

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      upload_limit:
        description: "Số lượng video muốn upload"
        required: false
        default: ""

jobs:
  upload-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kiểm tra giờ và trạng thái chạy hôm nay
        id: check_schedule
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          TARGET_HOUR="${{ vars.SCHEDULE_HOUR || '7' }}"
          CURRENT_HOUR=$(TZ='Asia/Ho_Chi_Minh' date +%H | sed 's/^0//')
          TARGET_HOUR=$(echo "$TARGET_HOUR" | sed 's/^0//')
          TODAY=$(TZ='Asia/Ho_Chi_Minh' date +%Y-%m-%d)

          # Kiểm tra xem hôm nay đã có lượt chạy thành công nào chưa qua GitHub API
          RUN_COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/run.yml/runs?event=schedule&status=success&created=>=${TODAY}T00:00:00Z" --jq '.total_count')

          echo "Hôm nay ($TODAY) đã chạy: $RUN_COUNT lần | Giờ hiện tại: ${CURRENT_HOUR}h | Cấu hình: ${TARGET_HOUR}h"

          if [ "$CURRENT_HOUR" -ge "$TARGET_HOUR" ] && [ "$RUN_COUNT" -eq 0 ]; then
            echo "Đã đến hoặc qua giờ hẹn và hôm nay chưa chạy -> Kích hoạt."
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "Chưa tới giờ hoặc hôm nay đã upload rồi -> Bỏ qua."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.check_schedule.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check_schedule.outputs.should_run == 'true'
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run script
        if: steps.check_schedule.outputs.should_run == 'true'
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          SOURCE_FOLDER_ID: ${{ secrets.SOURCE_FOLDER_ID }}
          ARCHIVE_FOLDER_ID: ${{ secrets.ARCHIVE_FOLDER_ID }}
          UPLOAD_LIMIT: ${{ github.event.inputs.upload_limit || vars.UPLOAD_LIMIT || '1' }}
        run: python main.py
